<html lang="en">

<style>
.checkout-wrap{max-width:1050px;margin:0 auto;padding:34px 18px 60px}.checkout-title{margin-bottom:24px}.checkout-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr);gap:24px;align-items:start}.checkout-card{background:var(--surface,#fff);border:1px solid var(--line,#e7e1dc);border-radius:18px;padding:24px;box-shadow:0 8px 28px rgba(35,20,12,.06);margin-bottom:18px}.checkout-card h2{font-size:1.2rem;margin:0 0 18px}.checkout-fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.checkout-field{display:flex;flex-direction:column;gap:7px}.checkout-field.full{grid-column:1/-1}.checkout-field label{font-weight:650;font-size:.92rem}.checkout-field input,.checkout-field select,.checkout-field textarea{width:100%;min-height:46px;border:1px solid #dce0e6;border-radius:12px;padding:10px 13px;background:#fff;color:#263244}.checkout-field textarea{min-height:78px}.checkout-order-type{display:inline-flex;align-items:center;gap:8px;background:#eaf2f6;color:#356f8a;padding:8px 12px;border-radius:999px;font-weight:700}.checkout-summary-item{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.checkout-summary-item img{width:60px;height:60px;object-fit:cover;border-radius:12px;background:#f5f1ed}.checkout-summary-item strong{display:block}.checkout-total{display:flex;justify-content:space-between;padding-top:16px;font-weight:800;font-size:1.12rem}.payment-options{display:flex;gap:12px;flex-wrap:wrap}.payment-option{display:flex;align-items:center;gap:9px;border:1px solid #dfe3e8;border-radius:14px;padding:14px;cursor:pointer}.payment-option:has(input:checked){border-color:#397894;background:#eef5f8}.place-order{width:100%;min-height:54px;font-size:1.05rem;font-weight:750;margin-top:18px}.checkout-note{font-size:.85rem;color:#687487;margin-top:12px}.checkout-hidden{display:none!important}@media(max-width:760px){.checkout-grid{grid-template-columns:1fr}.checkout-card{padding:18px}.checkout-fields{grid-template-columns:1fr}.checkout-field.full{grid-column:auto}}

/* Bakerz Bite checkout polish — scoped to this page */
.checkout-wrap{max-width:1120px;padding-top:42px;position:relative}
.checkout-wrap:before{content:"";position:absolute;inset:0 0 auto;height:245px;border-radius:28px;background:radial-gradient(ellipse at 12% 0%,rgba(197,133,58,.16),transparent 52%),linear-gradient(135deg,rgba(255,248,238,.92),rgba(250,239,222,.45));z-index:-1;pointer-events:none}
.checkout-title{position:relative;padding:10px 8px 22px 18px;margin-bottom:14px}
.checkout-title:before{content:"";position:absolute;left:0;top:14px;bottom:32px;width:4px;border-radius:9px;background:linear-gradient(#c58a42,#6c351b)}
.checkout-title .kicker{display:inline-flex;align-items:center;gap:7px;color:#875324;background:#f6e8d4;border:1px solid #ead4b5;border-radius:999px;padding:6px 12px;font-size:.78rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.checkout-title .kicker:before{content:"✦";font-size:.85rem}
.checkout-title h1{font-family:Georgia,'Times New Roman',serif;font-weight:800;letter-spacing:-.035em;color:#402313;margin:12px 0 8px;font-size:clamp(2rem,4vw,3rem)}
.checkout-title p{font-size:1rem;max-width:560px;margin:0;color:#756458}
.checkout-grid{gap:22px}
.checkout-card{border:1px solid #eadfd1;border-radius:20px;padding:25px;background:rgba(255,255,255,.96);box-shadow:0 12px 32px rgba(69,39,19,.065);transition:box-shadow .2s,border-color .2s}
.checkout-card h2{font-size:1.08rem;font-weight:800;color:#422716;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.checkout-card h2:before{content:"";display:inline-block;width:7px;height:22px;border-radius:5px;background:#c18a4b}
.checkout-order-type{background:#f8eddf;color:#79451f;border:1px solid #edd8bb;padding:9px 13px}
#orderLocationText{line-height:1.65;color:#77695e}
#changeOrderType{border-radius:11px;border-color:#d7b78f;color:#75451f;font-weight:700;padding:9px 14px}
#changeOrderType:hover{background:#fbf1e4}
.checkout-field label{color:#4b3528;font-size:.9rem}
.checkout-field input,.checkout-field select,.checkout-field textarea{border-color:#e2d8cd;border-radius:12px;min-height:48px;padding:12px 14px;transition:border-color .18s,box-shadow .18s}
.checkout-field input:focus,.checkout-field select:focus,.checkout-field textarea:focus{outline:0;border-color:#bd8749;box-shadow:0 0 0 3px rgba(189,135,73,.15)}
.checkout-field textarea{resize:vertical}
.checkout-summary-item{grid-template-columns:64px minmax(0,1fr) auto;gap:13px;padding:14px 0;border-color:#f0e8df}
.checkout-summary-item img{width:64px;height:64px;border:1px solid #eee2d5;border-radius:14px}
.checkout-summary-item strong{color:#38271e;font-size:.94rem;line-height:1.4}
.checkout-summary-item .muted{font-size:.84rem;display:inline-block;margin-top:4px}
.checkout-summary-item>b{color:#78441f;font-size:.9rem;white-space:nowrap}
.checkout-total{border-top:1px dashed #dfcbb3;margin-top:12px;padding-top:19px;color:#432918}
.checkout-total span:last-child{font-size:1.3rem;color:#9a602b}
.payment-options{gap:12px}
.payment-option{flex:1;min-width:160px;min-height:58px;border-color:#e8ded2;border-radius:14px;padding:15px;background:#fffdf9;color:#4a3527;font-weight:650;transition:all .18s}
.payment-option:has(input:checked){border-color:#a96e31;background:#fff5e7;box-shadow:0 0 0 3px rgba(169,110,49,.1)}
.payment-option input{accent-color:#895022}
.checkout-note{background:#fbf5ed;border-radius:10px;padding:10px 12px;color:#806b59;line-height:1.5}
.place-order{border:0!important;border-radius:14px!important;background:linear-gradient(110deg,#6d351b,#a56a30)!important;box-shadow:0 8px 18px rgba(109,53,27,.2);min-height:58px;letter-spacing:.01em;transition:transform .18s,box-shadow .18s}
.place-order:hover{transform:translateY(-1px);box-shadow:0 12px 22px rgba(109,53,27,.25)}
.checkout-card .btn-outline{border-radius:12px;border-color:#d9c5ad;color:#75451f;font-weight:700}
.checkout-card .btn-outline:hover{background:#fbf1e5}
@media(max-width:760px){.checkout-wrap{padding:24px 13px 42px}.checkout-title{padding-left:14px}.checkout-title h1{font-size:2rem}.checkout-card{padding:18px;border-radius:16px}.checkout-summary-item{grid-template-columns:54px minmax(0,1fr) auto;gap:10px}.checkout-summary-item img{width:54px;height:54px}.payment-option{min-width:100%;}}

/* Checkout: 3-step flow (Address > Payment > Review) in espresso mocha */
.ck-wizard{max-width:1060px}
.ck-back{display:inline-flex;align-items:center;gap:6px;color:#7a6a5f;font-weight:600;text-decoration:none;margin:0 0 14px}
.ck-back:hover{color:#3b2418}
.ck-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px;align-items:start}
.ck-layout .checkout-card{margin-bottom:0}
.ck-summary{padding:22px}
.ck-sum-h{font-size:1rem;font-weight:800;color:#3b2418;margin:0 0 14px}
.ck-sum-row{display:flex;justify-content:space-between;gap:10px;color:#6b5a4d;font-size:.92rem;padding:5px 0}
.ck-sum-row b{color:#3b2418;font-weight:600}
.ck-sum-total{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #eadfd1;margin-top:10px;padding-top:14px;color:#6b5a4d;font-weight:800}
.ck-sum-total b{color:#3b2418;font-size:1.05rem}
@media(max-width:860px){.ck-layout{grid-template-columns:minmax(0,1fr)}}
.ck-steps{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.ck-step{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;background:#fff;color:#7a6a5f;font:inherit;font-weight:700;font-size:.95rem;padding:11px 18px;box-shadow:0 2px 8px rgba(69,39,19,.07);cursor:pointer}
.ck-step svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.ck-step.is-on{background:#3b2418;color:#fff7ed}
.ck-step:disabled{cursor:default;opacity:1}
.ck-panel{padding:26px}
.ck-h{display:flex;align-items:center;gap:10px;font-size:1.2rem;font-weight:800;color:#3b2418;margin:0 0 20px}
.ck-h svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ck-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #3b2418;border-radius:12px;background:#3b2418;color:#fff7ed;font:inherit;font-weight:800;font-size:1rem;padding:14px 22px;cursor:pointer;transition:background-color .22s,color .22s,border-color .22s}
.ck-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ck-btn:disabled{background:#b9a99c;border-color:#b9a99c;color:#fff;cursor:not-allowed}
.ck-btn.ck-block{width:100%}
.ck-btn.ck-outline{background:#fff;color:#5a4636;border:1.5px solid #3b2418;font-weight:600;margin-bottom:18px}
.ck-btn.ck-ghost{background:transparent;color:#5a4636;border:1.5px solid #d9c5ad;font-weight:700}
.ck-pay{display:flex;align-items:center;gap:14px;border:1.5px solid #e6d9cb;border-radius:14px;background:#fffdf9;padding:16px 18px;margin-bottom:14px;cursor:pointer;transition:border-color .18s,background .18s}
.ck-pay:has(input:checked){border-color:#3b2418;background:#fbf5ed;box-shadow:0 0 0 1px #3b2418}
.ck-pay input{width:20px;height:20px;accent-color:#3b2418;flex:0 0 auto}
.ck-pay strong{display:block;color:#3b2418;font-size:.98rem}
.ck-pay span{display:block;color:#8a7868;font-size:.84rem;margin-top:2px}
.ck-box{background:#fbf5ed;border-radius:14px;padding:16px 18px;margin-bottom:18px}
.ck-box b{display:flex;align-items:center;gap:8px;color:#3b2418;font-size:.95rem;margin-bottom:8px}
.ck-box b svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ck-box p{margin:0;color:#7a6a5f;font-size:.95rem;line-height:1.55;word-break:break-word}
.ck-item{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 0}
.ck-item img{width:56px;height:56px;object-fit:cover;border-radius:10px;background:#f5f1ed}
.ck-item strong{display:block;color:#38271e;font-size:.95rem}
.ck-item small{color:#8a7868}
.ck-item>b{color:#3b2418;white-space:nowrap}
.ck-items{margin-bottom:12px}
@media(max-width:760px){.ck-panel{padding:18px}.ck-step{padding:10px 14px;font-size:.88rem}}

</style>

</head>
<body>
<div class="topline"><div class="container"><span>✦ Freshly baked every day</span><span class="visitor" id="visitorCount">Welcome to Bakerz Bite</span></div></div>
<header class="navbar"><div class="container nav-inner"><a class="brand" href="../index.html"><img alt="Bakerz Bite logo" class="brand-logo-img" src="../images/logo-bakerz-bite.png?v=4"/><span class="brand-name">Bakerz <span class="brand-bite">Bite</span><small>Bakery &amp; patisserie</small></span></a><button aria-controls="navLinks" aria-expanded="false" aria-label="Toggle navigation" class="menu-toggle" id="menuToggle" type="button"><span aria-hidden="true" class="hamburger-lines"><i></i><i></i><i></i></span><span class="menu-toggle-label">Menu</span></button><nav class="nav-links" id="navLinks"><a href="../index.html">Home</a><a href="menu.html">Menu</a><a href="gallery.html">Gallery</a><a href="offers.html">Offers</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav><div class="nav-actions"><button aria-checked="false" aria-label="Switch theme" class="theme-switch" id="themeToggle" role="switch" title="Switch theme" type="button"><span class="theme-switch-track"><span aria-hidden="true" class="theme-switch-knob" id="themeIcon">☀</span></span></button><a aria-label="Shopping cart" class="nav-cart-icon" href="cart.html">🛒 <span class="cart-count" data-cart-count="">0</span></a></div></div></header>
<main class="fade-in"><div class="checkout-wrap"><div class="checkout-title"><span class="kicker">Almost there</span><h1>Complete Your Order</h1><p class="muted">Add your details below and place your order.</p></div>
<div class="ck-wizard"><a class="ck-back" href="cart.html">← Back</a><div class="checkout-card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h2 style="margin:0">Order method</h2></div><p class="muted" id="orderLocationText" style="margin:12px 0 0"></p><button class="btn btn-outline" id="changeOrderType" style="margin-top:14px" type="button">Change delivery / pick-up</button></div>
<div class="ck-steps" id="ckSteps"></div>
<div class="ck-layout"><div class="checkout-card ck-panel" id="ckPanel"></div><aside class="checkout-card ck-summary" id="ckSummary"></aside></div></div></div></main>
<div class="ticker"><span id="tickerText">Bakerz Bite • Freshly baked, thoughtfully made</span></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const money=n=>'Rs. '+Number(n).toLocaleString('en-PK');
 const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let cart=[]; try{cart=JSON.parse(localStorage.getItem('bakerzCart')||'[]')}catch(e){}
 const sub=cart.reduce((s,x)=>s+Number(x.price)*Number(x.qty),0);
 const qtyN=cart.reduce((s,x)=>s+Number(x.qty),0);
 const delivery=cart.length?150:0;
 const total=sub+delivery;
 const pref=()=>{try{return JSON.parse(localStorage.getItem('bakerzOrderPref')||'null')}catch(e){return null}};
 const isPickup=()=>{const p=pref();return !!p&&p.type==='pickup'};
 const place_=()=>{const p=pref();return p?p.place+(p.city?', '+p.city:''):''};
 function updateMethod(){const p=pref(); if(!p){document.getElementById('orderLocationText').textContent='Select delivery or pick-up to continue.';return} document.getElementById('orderLocationText').textContent=(p.type==='pickup'?'Collect your order from ':'Deliver to ')+p.place+(p.city?', '+p.city:'');}
 updateMethod();

 const S='fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
 const ICON={
  pin:`<svg viewBox="0 0 24 24" ${S}><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>`,
  card:`<svg viewBox="0 0 24 24" ${S}><rect x="3" y="5.5" width="18" height="13" rx="2.2"/><path d="M3 10h18"/></svg>`,
  check:`<svg viewBox="0 0 24 24" ${S}><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`,
  chev:`<svg viewBox="0 0 24 24" ${S}><path d="M9 6l6 6-6 6"/></svg>`,
  truck:`<svg viewBox="0 0 24 24" ${S}><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7.5" cy="17.5" r="1.7"/><circle cx="17" cy="17.5" r="1.7"/></svg>`
 };

 let step=1, maxStep=1, payment='';
 const payLabel=()=>isPickup()?'Pay at pickup':'Cash on Delivery';
 const stepsEl=document.getElementById('ckSteps'), panel=document.getElementById('ckPanel'), summary=document.getElementById('ckSummary');

 function renderSummary(){
  if(!cart.length){summary.style.display='none';return}
  summary.style.display='';
  summary.innerHTML=`<h3 class="ck-sum-h">Order Summary</h3><div class="ck-sum-row"><span>SubTotal (${qtyN} item${qtyN===1?'':'s'})</span><b>${money(sub)}</b></div><div class="ck-sum-row"><span>Delivery</span><b>${money(delivery)}</b></div><div class="ck-sum-total"><span>Total</span><b>${money(total)}</b></div>`;
 }
 function renderSteps(){
  const defs=[[1,'Payment',ICON.card],[2,'Review',ICON.check]];
  stepsEl.innerHTML=defs.map(([n,l,ic])=>`<button type="button" class="ck-step${step===n?' is-on':''}" data-step="${n}"${n>maxStep?' disabled':''}>${ic}<span>${l}</span>${n<2?ICON.chev:''}</button>`).join('');
 }
 function paymentPanel(){
  const opts=[['Credit / Debit Card','Pay securely with your card'],[payLabel(),isPickup()?'Pay when you pick up':'Pay when you receive']];
  panel.innerHTML=`<h3 class="ck-h">${ICON.card}<span>Payment Method</span></h3>`+opts.map(([v,d])=>`<label class="ck-pay"><input type="radio" name="ckPay" value="${esc(v)}"${payment===v?' checked':''}><div><strong>${esc(v)}</strong><span>${esc(d)}</span></div></label>`).join('')+`<button type="button" class="ck-btn" data-act="to-review"${payment?'':' disabled'}><span>Review Order</span>${ICON.chev}</button>`;
 }
 function reviewPanel(){
  const p=pref();
  const where=!p?`<b>${ICON.pin}<span>Order Method</span></b><p>Please choose delivery or pick-up above.</p>`:isPickup()?`<b>${ICON.pin}<span>Pick-up From</span></b><p>${esc(place_())}</p>`:`<b>${ICON.truck}<span>Delivery Location</span></b><p>${esc(place_())}</p>`;
  panel.innerHTML=`<h3 class="ck-h">${ICON.check}<span>Review Your Order</span></h3><div class="ck-box">${where}</div><div class="ck-items">`+cart.map(x=>`<div class="ck-item"><img src="${esc('../'+String(x.image||'images/logo-bakerz-bite.png').replace(/^(\.\.\/)+/,''))}" alt=""><div><strong>${esc(x.name)}</strong><small>Qty: ${esc(x.qty)}</small></div><b>${money(x.price*x.qty)}</b></div>`).join('')+`</div><button type="button" class="ck-btn ck-block" data-act="place"${p?'':' disabled'}><span>Place Order — ${money(total)}</span></button>`;
 }
 function render(){
  renderSummary();
  if(!cart.length){stepsEl.innerHTML='';panel.innerHTML='<p style="margin:0">Your cart is empty. <a href="menu.html">Browse the menu</a>.</p>';return}
  renderSteps();
  if(step===1)paymentPanel(); else reviewPanel();
 }
 const go=n=>{step=n;if(n>maxStep)maxStep=n;render();};

 async function place(){
  if(!cart.length||!pref()||!payment)return;
  const placeBtn=panel.querySelector('[data-act="place"]'); if(placeBtn){placeBtn.disabled=true;placeBtn.textContent='Placing your order…';}
  const items=cart.map(i=>({id:i.id,name:i.name,price:Number(i.price),qty:i.qty,image:i.image}));
  const orderId='BB-'+Date.now().toString(36).toUpperCase();
  const user=typeof currentUser==='function'?currentUser():null;
  const details={title:'',name:(user&&user.name)||'',phone:'',alternatePhone:'',email:(user&&user.email)||'',notes:'',payment:payment,address:isPickup()?'':place_()};
  localStorage.setItem('bakerzLastOrder',JSON.stringify(items));
  localStorage.setItem('bakerzLastOrderId',orderId);
  localStorage.setItem('bakerzLastOrderTotals',JSON.stringify({subtotal:sub,delivery:delivery,tax:0,total:total}));
  localStorage.setItem('bakerzLastOrderPlace',JSON.stringify({type:isPickup()?'pickup':'delivery',place:(pref()||{}).place||'',city:(pref()||{}).city||''}));
  localStorage.setItem('bakerzLastOrderType',typeof orderPrefLabel==='function'?orderPrefLabel():'');
  localStorage.setItem('bakerzCustomerDetails',JSON.stringify(details));
  localStorage.removeItem('bakerzCart');
  if(window.sendOrderEmail){ await window.sendOrderEmail({orderId:orderId,customer:details.name||'Guest (not logged in)',email:details.email||'Not provided',type:isPickup()?'Pick-up':'Delivery',place:place_(),payment:payment,items:items,subtotal:sub,delivery:delivery,total:total}); }
  location.href='thank-you.html';
 }

 stepsEl.addEventListener('click',e=>{const b=e.target.closest('.ck-step');if(b&&!b.disabled)go(Number(b.dataset.step))});
 panel.addEventListener('click',e=>{
  const btn=e.target.closest('[data-act]'); if(!btn)return;
  if(btn.dataset.act==='to-review'){if(payment)go(2)}
  else if(btn.dataset.act==='place')place();
 });
 panel.addEventListener('change',e=>{if(e.target.name==='ckPay'){payment=e.target.value;const nb=panel.querySelector('[data-act="to-review"]');if(nb)nb.disabled=false}});
 document.getElementById('changeOrderType').addEventListener('click',()=>{if(typeof openOrderPopup==='function')openOrderPopup(true,()=>{updateMethod();payment='';maxStep=1;go(1)})});
 render();
});
</script>
</body></html>
